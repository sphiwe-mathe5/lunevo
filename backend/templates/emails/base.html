<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UJCIMS{% endblock %}</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #09090b;
            color: #fafafa;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #09090b;
        }
        .header {
            padding: 32px 24px;
            text-align: center;
            border-bottom: 1px solid #27272a;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #fafafa;
        }
        .header h1 span {
            color: #3b82f6; /* Accent color */
        }
        .content {
            padding: 32px 24px;
            background-color: #09090b;
        }
        .footer {
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: #a1a1aa;
            border-top: 1px solid #27272a;
        }
        .btn {
            display: inline-block;
            background-color: #fafafa;
            color: #09090b;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            margin-top: 16px;
        }
        .btn:hover {
            background-color: #e4e4e7;
        }
        .card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
        }
        p {
            margin-top: 0;
            margin-bottom: 16px;
            color: #d4d4d8;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#09090b">
        <tr>
            <td align="center">
                <div class="container">
                    <div class="header">
                        <h1>UJ<span>CIMS</span></h1>
                    </div>
                    <div class="content">
                        {% block content %}{% endblock %}
                    </div>
                    <div class="footer">
                        <p>University of Johannesburg Clinic Inventory Management System<br>
                        This is an automated message, please do not reply.</p>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
